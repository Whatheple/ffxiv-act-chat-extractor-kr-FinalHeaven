<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A chat parser for Final Fantasy XIV Online with the Advanced Combat Tracker (ACT) plugin." />
  <title>FFXIV ACT Plugin Chat Extractor Kr Final Heaven</title>
  <style type="text/css">
    :root {
      --color-light-hsl: hsl(0, 0%, 95%);
      --color-light-highlight-hsl: hsl(0, 0%, 90%);
      --color-dark-hsl: hsl(0, 0%, 5%);
      --color-popover-background: hsl(0, 0%, 10%);
      --color-dark-highlight-hsl: hsl(0, 0%, 15%);
      --color-width: 20px;

      /* FF14 테마 변수 */
      --ff14-gold: #c8a84b;
      --ff14-gold-light: #e8d08a;
      --ff14-gold-dark: #8a6f2e;
      --ff14-bg: #1a1510;
      --ff14-bg-panel: rgba(12, 10, 7, 0.97);
      --ff14-bg-hover: rgba(200, 168, 75, 0.12);
      --ff14-border: #c8a84b;
      --ff14-text: #e8dfc8;
      --ff14-text-dim: #a09070;
    }

    a {
      color: var(--color-light-hsl);
      cursor: pointer;
    }

    a:hover {
      color: var(--color-light-highlight-hsl);
    }

    .save-as {
      display: flex;
      align-items: center;
      font-weight: bold;
      gap: 1rem;
    }

    .filter {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 500px;
    }


    #filter-popover {
      position: fixed;
      z-index: 200;
      width: max-content;
      min-width: 200px;
      max-width: 480px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.5rem 0.75rem;
      background-color: var(--color-popover-background);
      border: 1px solid var(--color-light-hsl);
      box-shadow: 5px 5px 15px 5px hsla(0, 0%, 95%, 0.1);
    }

    .filter-types-toggle-container {
      display: flex;
      gap: 1rem;
      padding: 0.5rem 0;
      font-weight: bold;
      font-size: 0.85em;
    }

    .filter-types-toggle-container span {
      cursor: pointer;
    }

    .filter-types-toggle-container span:hover {
      text-decoration: underline;
      text-decoration-color: var(--color-light-hsl);
    }

    .hover-highlight {
      user-select: none;
    }

    .hover-highlight:hover {
      background-color: var(--color-dark-highlight-hsl);
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
    }
    input[type="color"]::-moz-color-swatch {
      border: none;
    }

    input[type=color] {
      width: var(--color-width);
      height: var(--color-width);
      border: 1px solid grey;
      cursor: pointer;
    }

    .filter-message-type-grid {
      display: grid;
      grid-template-columns: 1fr var(--color-width);
      grid-column-gap: 0.25em;
      margin-top: 0.25em;
      padding-right: 0.5rem;
    }

    .filter-message-type-grid input[type=color] {
      opacity: 0.2;
      transition: opacity 50ms ease-in;
    }

    .filter-message-type-grid:hover input[type=color] {
      opacity: 1;
    }

    .filter-message-type {
      cursor: pointer;
      display: block;
    }

    .filter-senders-container {
      display: flex;
      flex-direction: column;
    }

    .filter-sender {
      cursor: pointer;
    }

    .chat-settings-popover-container {
      margin-top: 0.5rem;
    }

    body {
      background-color: hsl(0, 0%, 5%);
      color: hsl(0, 0%, 95%);
      text-shadow: 1px 1px 0px rgba(64, 64, 64, 0.18);
      font-family: Arial;
      transition: background-color 0.2s, color 0.2s;
    }

    #output {
      padding: 0.5rem;
    }

    .line {
      margin: 0.5rem 0;
    }

    .line.compact-same {
      margin: 0.1rem 0 !important;
    }
    .line.compact-diff {
      margin: 1rem 0 0.1rem 0 !important;
    }

    .search-hit-line {
      border-left: 3px solid orange;
      background-color: rgba(255, 165, 0, 0.1);
      padding-left: 5px;
    }
    .search-hit-line.current-focus {
      background-color: rgba(255, 165, 0, 0.3);
      outline: 1px solid orange;
    }

    .sender {
      font-weight: bold;
    }

    body.white-mode {
      background-color: #ffffff !important;
      color: #000000 !important;
    }
    body.white-mode #filter-popover {
      background-color: var(--color-popover-background) !important;
      border: 1px solid #555 !important;
    }
    body.white-mode #filter-popover label,
    body.white-mode #filter-popover span,
    body.white-mode #filter-popover p {
      color: #ffffff !important;
    }
    body.white-mode #filter-popover button {
      color: #000000 !important;
      background-color: #f0f0f0 !important;
    }
    body.white-mode .save-as-html, body.white-mode #undo-btn {
      color: #000000 !important;
    }
    body.white-mode .say {
      color: #000000 !important;
    }
    body.white-mode .search-hit-line {
      background-color: rgba(255, 165, 0, 0.2);
    }
    body.white-mode .sticky-toolbar {
      background-color: #ffffff !important;
    }

    /* ── FF14 스크롤바 — 전체 페이지 (크게) ── */
    /* Chrome/Edge: html에 명시해야 페이지 스크롤바에 적용됨 */
    html::-webkit-scrollbar {
      width: 24px;
      height: 24px;
    }
    html::-webkit-scrollbar-track {
      background: #0e0c08;
      border-left: 1px solid #2a2010;
    }
    html::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #8a6f2e 0%, #c8a84b 50%, #8a6f2e 100%);
      border-radius: 0;
    }
    html::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #c8a84b 0%, #e8d08a 50%, #c8a84b 100%);
    }
    html::-webkit-scrollbar-corner {
      background: #0e0c08;
    }
    /* Firefox: auto여야 width 지정이 의미있음 (thin은 브라우저 고정값) */
    html {
      scrollbar-width: auto;
      scrollbar-color: #8a6f2e #0e0c08;
    }

    /* 팝오버 내부 스크롤바는 작게 */
    #filter-popover::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    #filter-popover::-webkit-scrollbar-track {
      background: #0e0c08;
    }
    #filter-popover::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #8a6f2e 0%, #c8a84b 50%, #8a6f2e 100%);
    }
    #filter-popover {
      scrollbar-width: thin;
      scrollbar-color: #8a6f2e #0e0c08;
    }

    body.white-mode html { scrollbar-color: #c8a84b #ece4d0; }
    body.white-mode html::-webkit-scrollbar-track { background: #ece4d0; border-left: 1px solid #c8a84b; }
    body.white-mode html::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #c8a84b 0%, #e8d08a 50%, #c8a84b 100%); }
    .sticky-toolbar {
      background: linear-gradient(180deg, #1e1a12 0%, #0e0c08 100%) !important;
      border-bottom: 1px solid var(--ff14-gold-dark);
      box-shadow: 0 2px 12px rgba(0,0,0,0.7), inset 0 -1px 0 rgba(200,168,75,0.15);
      padding: 6px 10px !important;
      gap: 0.6rem !important;
    }

    /* 툴바 버튼 공통 — .filter button 대신 구체 클래스로 한정 */
    .sticky-toolbar button:not(.popover-close-button),
    .filter-types, .filter-senders, .sender-colours,
    .name-rename, .chat-settings, .filter-time {
      background: linear-gradient(180deg, #2a2318 0%, #1a1510 100%);
      color: var(--ff14-gold-light);
      border: 1px solid var(--ff14-gold-dark);
      padding: 3px 10px;
      font-size: 0.82em;
      font-weight: bold;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .sticky-toolbar button:not(.popover-close-button):hover,
    .filter-types:hover, .filter-senders:hover, .sender-colours:hover,
    .name-rename:hover, .chat-settings:hover, .filter-time:hover {
      background: linear-gradient(180deg, #3a3020 0%, #252010 100%);
      border-color: var(--ff14-gold);
      color: var(--ff14-gold-light);
      box-shadow: 0 0 6px rgba(200,168,75,0.3), inset 0 0 8px rgba(200,168,75,0.08);
    }

    .sticky-toolbar button:not(.popover-close-button):active,
    .filter-types:active, .filter-senders:active, .sender-colours:active,
    .name-rename:active, .chat-settings:active, .filter-time:active {
      background: linear-gradient(180deg, #1a1510 0%, #0e0c08 100%);
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.5);
    }

    /* 저장하기 링크를 버튼처럼 */
    .save-as-html {
      background: linear-gradient(180deg, #2a2318 0%, #1a1510 100%) !important;
      color: var(--ff14-gold-light) !important;
      border: 1px solid var(--ff14-gold-dark) !important;
      padding: 3px 10px !important;
      font-size: 0.82em !important;
      transition: background 0.15s, border-color 0.15s !important;
    }
    .save-as-html:hover {
      background: linear-gradient(180deg, #3a3020 0%, #252010 100%) !important;
      border-color: var(--ff14-gold) !important;
      box-shadow: 0 0 6px rgba(200,168,75,0.3) !important;
    }

    /* 되돌리기 링크 */
    #undo-btn {
      color: var(--ff14-gold-light) !important;
      font-size: 0.82em;
    }
    #undo-btn:hover { color: var(--ff14-gold) !important; }

    /* 검색 입력 */
    #search-input {
      background: rgba(10, 8, 5, 0.8) !important;
      color: var(--ff14-text) !important;
      border: 1px solid var(--ff14-gold-dark) !important;
      border-radius: 0 !important;
      padding: 3px 7px !important;
      font-size: 0.82em;
      outline: none;
      transition: border-color 0.15s;
    }
    #search-input:focus {
      border-color: var(--ff14-gold) !important;
      box-shadow: 0 0 5px rgba(200,168,75,0.25);
    }
    #search-input::placeholder { color: var(--ff14-text-dim); }
    #search-counter { color: var(--ff14-text-dim); font-size: 0.8em; }

    /* 복사 포맷 고정 박스 */
    .sticky-toolbar [style*="복사 포맷"] {
      border-color: var(--ff14-gold-dark) !important;
    }

    /* 팝오버 FF14 스타일 — position:fixed는 기존 규칙(line 53)에서 유지 */
    #filter-popover {
      background: linear-gradient(160deg, #1e1a12 0%, #0e0c08 100%) !important;
      border: 1px solid var(--ff14-gold-dark) !important;
      box-shadow: 0 4px 24px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(200,168,75,0.07) !important;
      font-size: 0.96em;
    }

    /* 팝오버 닫기 버튼 */
    .popover-close-button {
      width: 100%;
      margin-bottom: 6px;
    }

    /* hover-highlight FF14 스타일 */
    .hover-highlight:hover {
      background-color: var(--ff14-bg-hover) !important;
    }

    /* 팝오버 내부 텍스트 크기 통일 (시간 필터링 기준보다 살짝 작게) */
    #filter-popover label,
    #filter-popover span:not(.remove-single-replace),
    #filter-popover p,
    #filter-popover .filter-message-type,
    #filter-popover .hover-highlight {
      font-size: 0.96em !important;
    }
    /* 팝오버 내 텍스트 색상 */
    #filter-popover label,
    #filter-popover span,
    #filter-popover p {
      color: var(--ff14-text);
    }

    /* 구분선 느낌 — 팝오버 내 단락 */
    #filter-popover p {
      border-bottom: 1px solid var(--ff14-gold-dark);
      padding-bottom: 4px;
      margin-bottom: 4px;
      font-size: 0.82em;
      color: var(--ff14-text-dim);
    }

    /* radio / checkbox 색상 */
    .sticky-toolbar input[type="radio"],
    .sticky-toolbar input[type="checkbox"] {
      accent-color: var(--ff14-gold);
    }
    #filter-popover input[type="radio"],
    #filter-popover input[type="checkbox"] {
      accent-color: var(--ff14-gold);
    }

    /* ── 반응형 ── */
    @media (max-width: 600px) {
      .log-parser { padding: 8px 10px; margin: 4px; }
      .sticky-toolbar {
        gap: 0.4rem !important;
        padding: 5px 8px !important;
        flex-wrap: wrap !important;
      }
      .filter { flex-wrap: wrap !important; max-width: 100% !important; }
      .filter-types, .filter-senders, .sender-colours,
      .name-rename, .chat-settings, .filter-time {
        font-size: 0.75em !important;
        padding: 3px 6px !important;
      }
      #search-input { width: 120px !important; }
      #filter-popover {
        max-width: calc(100vw - 16px) !important;
        left: 8px !important;
      }
      .save-as-html { font-size: 0.78em !important; padding: 3px 6px !important; }
      #output { padding: 2px 6px; }
      .line { word-break: break-word; }
    }

    /* ── FF14: body 기본 ── */
    body {
      background-color: #0d0d0d;
      color: #d0c8b0;
      font-family: 'Segoe UI', 'Meiryo', 'Noto Sans KR', sans-serif;
      /* 창 너비에 비례해 폰트 크기 자동 조정: 300px에서 12px ~ 1200px에서 16px */
      font-size: clamp(12px, 1vw + 11px, 16px);
    }

    /* ── 로그 파서 영역 ── */
    .log-parser {
      padding: 6px 10px;
      background: linear-gradient(160deg, #1a1610 0%, #0e0c08 100%);
      border: 1px solid var(--ff14-gold-dark);
      margin: 12px;
      box-shadow: 0 0 0 1px #0a0806, 0 4px 20px rgba(0,0,0,0.7);
      position: relative;
    }
    /* 모서리 장식 */
    .log-parser::before,
    .log-parser::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      border-color: var(--ff14-gold);
      border-style: solid;
    }
    .log-parser::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .log-parser::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .log-parser h1 {
      color: var(--ff14-gold-light);
      font-size: 1em;
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px rgba(200,168,75,0.4);
      border-bottom: 1px solid var(--ff14-gold-dark);
      padding-bottom: 6px;
      margin-bottom: 8px !important;
    }
    .log-parser p {
      color: var(--ff14-text-dim);
      font-size: 0.82em;
      margin-bottom: 3px !important;
    }

    /* ── 파일 입력 버튼 ── */
    #loginput {
      background: linear-gradient(180deg, #2a2318 0%, #1a1510 100%);
      color: var(--ff14-gold-light);
      border: 1px solid var(--ff14-gold-dark);
      padding: 4px 12px;
      font-size: 0.85em;
      cursor: pointer;
    }
    #loginput:hover {
      background: linear-gradient(180deg, #3a3020 0%, #252010 100%);
      border-color: var(--ff14-gold);
    }
    #loginput::file-selector-button {
      background: transparent;
      color: var(--ff14-gold-light);
      border: none;
      font-size: 0.85em;
      cursor: pointer;
      padding: 0 8px 0 0;
    }

    /* ── 에러 텍스트 ── */
    #error { color: #e04040; font-size: 0.85em; }

    /* ── 툴바 인라인 스타일 override ── */
    .sticky-toolbar {
      background: linear-gradient(180deg, #1e1a12 0%, #0e0c08 100%) !important;
      border-bottom: 1px solid var(--ff14-gold-dark) !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 1px 0 rgba(200,168,75,0.08) !important;
      padding: 6px 12px !important;
    }

    /* 복사 포맷 고정 박스 텍스트 */
    .sticky-toolbar span,
    .sticky-toolbar label {
      color: var(--ff14-text);
      font-size: 0.82em;
    }

    /* ── 출력 영역 ── */
    #output {
      padding: 4px 12px;
    }

    /* ── 채팅 라인 ── */
    .line {
      padding: 1px 4px;
      line-height: 1.5;
      border-left: 2px solid transparent;
      transition: background 0.1s;
    }
    .line:hover {
      background: rgba(200, 168, 75, 0.05);
      border-left-color: var(--ff14-gold-dark);
    }

    /* ── 검색 하이라이트 ── */
    .search-hit-line {
      background-color: rgba(200, 168, 75, 0.12) !important;
      border-left-color: var(--ff14-gold) !important;
    }
    .search-hit-word {
      background: rgba(200, 168, 75, 0.35);
      color: var(--ff14-gold-light);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── 팝오버 컨테이너 추가 장식 — 상단 왼쪽만 (하단은 스크롤과 충돌) ── */
    #filter-popover::before {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border-color: var(--ff14-gold);
      border-style: solid;
      pointer-events: none;
      top: 0; left: 0; border-width: 1px 0 0 1px;
    }

    /* ── 팝오버 닫기 버튼 ── */
    .popover-close-button {
      background: linear-gradient(180deg, #2a2318 0%, #1a1510 100%) !important;
      color: var(--ff14-gold-light) !important;
      border: 1px solid var(--ff14-gold-dark) !important;
      width: 100%;
      padding: 4px 0 !important;
      font-size: 0.82em !important;
      letter-spacing: 0.1em;
    }
    .popover-close-button:hover {
      background: linear-gradient(180deg, #3a3020 0%, #252010 100%) !important;
      border-color: var(--ff14-gold) !important;
    }

    /* ── 팝오버 내 color input ── */
    #filter-popover input[type="color"] {
      background: #0e0c08;
      border: 1px solid var(--ff14-gold-dark);
      width: 36px; height: 22px;
      padding: 1px;
      cursor: pointer;
      border-radius: 0;
    }
    #filter-popover input[type="text"],
    #filter-popover input[type="number"],
    #filter-popover input[type="time"] {
      background: rgba(10,8,5,0.8);
      color: var(--ff14-text);
      border: 1px solid var(--ff14-gold-dark);
      padding: 2px 6px;
      border-radius: 0;
      font-size: 0.85em;
      outline: none;
    }
    #filter-popover input[type="text"]:focus,
    #filter-popover input[type="number"]:focus,
    #filter-popover input[type="time"]:focus {
      border-color: var(--ff14-gold);
      box-shadow: 0 0 4px rgba(200,168,75,0.2);
    }

    /* 시계 아이콘 색상 — 어두운 배경에서 보이도록 */
    #filter-popover input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(80%) sepia(30%) saturate(400%) hue-rotate(5deg) brightness(110%);
      cursor: pointer;
      opacity: 0.85;
    }
    #filter-popover input[type="time"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* ── 이름변경 팝오버 입력칸 ── */
    #filter-popover input[type="text"][placeholder="새 이름"] {
      background: rgba(10,8,5,0.8);
      border: 1px solid var(--ff14-gold-dark);
      color: var(--ff14-text);
    }

    /* ── 화이트 모드 ── */
    body.white-mode { background-color: #ffffff; color: #000000; }
    body.white-mode .sticky-toolbar {
      background: linear-gradient(180deg, #f5f0e8 0%, #ece4d0 100%) !important;
      border-bottom: 1px solid #c8a84b !important;
    }
    body.white-mode .sticky-toolbar button:not(.popover-close-button),
    body.white-mode .filter-types, body.white-mode .filter-senders,
    body.white-mode .sender-colours, body.white-mode .name-rename,
    body.white-mode .chat-settings, body.white-mode .filter-time {
      background: linear-gradient(180deg, #f5f0e8 0%, #e8dfc8 100%);
      color: #5a4010;
      border-color: #c8a84b;
    }
    body.white-mode .sticky-toolbar button:not(.popover-close-button):hover,
    body.white-mode .filter-types:hover, body.white-mode .filter-senders:hover,
    body.white-mode .sender-colours:hover, body.white-mode .name-rename:hover,
    body.white-mode .chat-settings:hover, body.white-mode .filter-time:hover {
      background: linear-gradient(180deg, #fffdf0 0%, #f5efd5 100%);
    }
    body.white-mode .save-as-html {
      background: linear-gradient(180deg, #f5f0e8 0%, #e8dfc8 100%) !important;
      color: #5a4010 !important;
      border-color: #c8a84b !important;
    }
    body.white-mode #search-input {
      background: #fff !important;
      color: #000 !important;
      border-color: #c8a84b !important;
    }
    body.white-mode .log-parser {
      background: #f5f0e8;
      border-color: #c8a84b;
    }
    body.white-mode .log-parser h1 { color: #5a4010; text-shadow: none; }
    body.white-mode #filter-popover {

        let left = parseFloat(filterPopoverElement.style.left) || 0;
        if (left + popoverWidth + margin > window.innerWidth) {

    function applyBgColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const textColor = luminance > 0.5 ? '#000000' : '#ffffff';
      document.body.style.backgroundColor = hex;
      document.body.style.color = textColor;
      messageTypes['000a'].color = textColor;
      updateColours();
    }

    function rgbToHex(rgb) {
      const m = rgb.match(/\d+/g);
      if (!m || m.length < 3) return '#0d0d0d';
      return '#' + m.slice(0, 3).map(n => parseInt(n).toString(16).padStart(2, '0')).join('');
    }

      updateSearchCounter();

    function positionPopover() {
      const filterRootElement = document.querySelector('.filter');
      if (!filterRootElement) return;
      const filterBounds = filterRootElement.getBoundingClientRect();
      const topPos = filterBounds.bottom + 5;
      const margin = 32;

      filterPopoverElement.style.top = `${topPos}px`;
      filterPopoverElement.style.maxHeight = `${window.innerHeight - topPos - 20}px`;

      // 내용이 채워진 뒤 실제 너비 측정
      const popoverWidth = filterPopoverElement.offsetWidth;
      const openerLeft = (filterPopoverElement._openerBounds?.left) ?? 0;
      let left = openerLeft;
      if (left + popoverWidth + margin > window.innerWidth) {
        left = window.innerWidth - popoverWidth - margin;
      }
      if (left < margin) left = margin;
      filterPopoverElement.style.left = `${left}px`;
      filterPopoverElement.style.visibility = '';
    }

    function transformTextToEmoteText(textParts, line) {
      let text = '';
      for (const part of textParts) {

    function transformAsterisksAsEmote(textParts, line) {

      for (const part of textParts) {

    function transformQuotesToSayOrCustomSender(textParts, line) {

      for (const part of textParts) {

          }

    function transformOutOfCharacter(textParts, line) {
      let text = '';
      for (const part of textParts) {
        if (!part.transform) {

        }

    }

    function getQuotationMatches(text, transformer) {
      let matches = [];
      let currentIndex = 0;
      while (currentIndex < text.length) {
        const nextIndices = getNextQuotationIndices(text, currentIndex);
        if (!nextIndices) break;
        const match = [text.substr(nextIndices.openingIndex, nextIndices.closingIndex - nextIndices.openingIndex)];
        match.index = nextIndices.openingIndex;
        matches.push(match);
        currentIndex = nextIndices.closingIndex;
      }
      return matches;
    }

    function getNextQuotationIndices(text, currentIndex) {
      const quotations = [];
      for (const quotationRule of quotationRules) {
        if (!quotationRule.active) continue;
        const openingIndex = text.indexOf(quotationRule.opening, currentIndex);
        if (openingIndex === -1) continue;
        for (const closingCharacter of quotationRule.closing) {
          const closingIndex = text.indexOf(closingCharacter, openingIndex + 1);
          if (closingIndex !== -1) {
            quotations.push({
              openingIndex,
              closingIndex: closingIndex + closingCharacter.length,
            });
          }
        }
      }
      if (!quotations.length) return undefined;
      quotations.sort((a, b) => a.openingIndex - b.openingIndex);
      return quotations[0];
    }

    function getOutOfCharacterMatches(text, transformer) {
      let matches = [];
      const firstIndex = text.indexOf('(');
      if (firstIndex === -1 || text.indexOf(')', firstIndex) === -1) return matches;
      if (!transformer.regex.test(text)) return matches;

      let lookingForOpening = true;
      let lookingForClosing = false;
      let currentOpenParenthesisCount = 0;
      let currentClosedParenthesisCount = 0;
      let currentOpeningStart = -1;

      for (let i = firstIndex; i < text.length; i++) {
        const char = text[i];
        if (lookingForOpening && char === '(') {
          currentOpenParenthesisCount++;
        } else if (lookingForClosing && char === ')') {
          currentClosedParenthesisCount++;
          if (currentClosedParenthesisCount === currentOpenParenthesisCount) {
            lookingForOpening = true;
            lookingForClosing = false;
            currentOpenParenthesisCount = 0;
            const length = i - currentOpeningStart + 1;
            const match = [text.substr(currentOpeningStart, length)];
            match.index = currentOpeningStart;
            matches.push(match);
          }
        } else {
          currentClosedParenthesisCount = 0;
          if (lookingForOpening && currentOpenParenthesisCount > 0) {
            currentOpeningStart = i - currentOpenParenthesisCount;
            lookingForOpening = false;
            lookingForClosing = true;
          }
        }
      }
      return matches;
    }

    function parseLines(rawLines) {
      const parsedLines = [];
      for (const rawLine of rawLines) {
        const match = rawLine.match(messageRegex);
        if (!match) continue;
        const { time, code, sender, message } = match.groups;
        const senderRef = getOrCreateSender(sender);
        parsedLines.push({
          id: self.crypto.randomUUID ? self.crypto.randomUUID() : Math.random().toString(36),
          code,
          time,
          sender,
          message: message.trim(),
          senderReference: senderRef,
        });
      }
      return parsedLines;
    }

    function handleLogUpload(event) {
      if (!event.target.files?.length) return;
      if (!hasAddedCSS) addCSS();

      const file = event.target.files[0];
      logFilename = file.name;
      const fr = new FileReader();
      fr.onload = () => { parseLog(fr.result || ''); }
      fr.onerror = () => {
        errorElement.innerHTML = `Failed to read file ${logFilename}`;
        const outputElement = document.getElementById('output');
        while (outputElement.firstChild) outputElement.removeChild(outputElement.firstChild);
      }
      fr.readAsText(file);
    }

    function parseLog(logText) {
      if (!logText) return;
      closeFilterPopover();
      customSenderColours.splice(0, customSenderColours.length);
      clearObjectURLs();
      
      deletedLinesStack = []; 
      updateUndoCounter();

      currentParsedLines = getLines(logText);

      // 001d sender 보정: 전체 파싱 후 알려진 발신자 이름 목록으로 서버명 매칭
      // startsWith 대신 서버명 목록을 직접 시도 → 동명이인(서버 다른 경우) 오매칭 방지
      const serverNames = ['Tonberry','Carbuncle','Chocobo','Moogle','Fenrir','톤베리','카벙클','초코보','모그리','펜리르'];
      const knownSenders = new Set(
        currentParsedLines
          .filter(l => l.code !== '001d' && l.sender)
          .map(l => l.sender)
      );
      for (const line of currentParsedLines) {
        if (line.code !== '001d' || !line.sender) continue;
        // 이미 서버명이 포함되어 있으면 건너뜀
        if (serverNames.some(s => line.sender.endsWith(s))) continue;
        // sender + 각 서버명 조합이 knownSenders에 있는지 확인
        const candidates = serverNames
          .map(s => line.sender + s)
          .filter(candidate => knownSenders.has(candidate));
        // 후보가 정확히 1개일 때만 교체 — 동명이인(서버 다름)이면 원본 유지
        if (candidates.length === 1) {
          line.sender = candidates[0];
          // senderReference는 이후 addAllSenders()에서 재할당됨
        }
      }

      addAllSenders(currentParsedLines);
      generateOutput(currentParsedLines);
    }

    function getLines(text) {
      const lines = text.split('\n');
      const result = [];
      const errors = {};
      let index = 0;
      for (const line of lines) {
        const match = line.match(messageRegex);
        if (!match || !match.groups) continue;

        const code = match.groups['code'].toLowerCase();
        const cleanedSender = match.groups['sender'].replace(/[\uE000-\uE0FF]/g, '');
        let rawMessage = match.groups['message'];

        rawMessage = rawMessage.replace(/\uFFFD+/g, '');
        rawMessage = rawMessage.replace(/\\?\s*i[0-9A-Fa-f]+/g, '');
        rawMessage = rawMessage.replace(/[\u0000-\u001F\u007F-\u009F]/g, '');
        rawMessage = rawMessage.replace(/[\uE000-\uE0FF]/g, '');
        rawMessage = rawMessage.replace(/\s{2,}/g, ' ');

        const cleanedMessage = escapeHTML(rawMessage).trim();
        let item = {
          code,
          message: cleanedMessage,
          sender: cleanedSender,
          time: match.groups['time'],
        };
        
        if (!messageTypes[code]) {
          let error = errors[code];
          if (!errors[code]) {
            error = { code, lines: [] };
            errors[code] = error
          }
          error.lines.push(item);
          continue;
        }

        item.id = index.toString();
        index++;

        // 001d(감정표현): 메시지 맨 앞에 "sender+서버명+조사" 형태가 포함됨
        // → 서버명을 sender에 추가하고, 조사는 item.emoteJosa에 보관, 메시지에서 이름+조사 제거
        if (code === '001d' && item.sender) {
          const serverNames = 'Tonberry|Carbuncle|Chocobo|Moogle|Fenrir|톤베리|카벙클|초코보|모그리|펜리르';
          const escapedSender = item.sender.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
          const josaGroup = '이|가|은|는|을|를|와|과|에게|한테|께|님이|씨가';
          const prefixPattern = new RegExp('^(' + escapedSender + '(?:' + serverNames + ')?)(' + josaGroup + ')?(.+)');
          const prefixMatch = item.message.match(prefixPattern);
          if (prefixMatch) {
            const fullName = prefixMatch[1];
            const josa = prefixMatch[2] || '';
            const rest = prefixMatch[3];
            const serverPart = fullName.slice(item.sender.length);
            if (serverPart) item.sender = fullName;
            item.emoteJosa = josa;   // 조사 보관
            item.message = rest.trimStart();
          }
        }

        result.push(item);
      }
      return result;
    }

    function escapeHTML(text) {
      return text.replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getDisplaySenderName(sender) {
      const serverRegex = /(Tonberry|Carbuncle|Chocobo|Moogle|Fenrir|톤베리|카벙클|초코보|모그리|펜리르)$/;
      const match = sender.match(serverRegex);
      if (!match) return sender;

      const serverName = match[0];
      const characterName = sender.replace(serverRegex, '');
      if (showServerName) {
        return characterName + '@' + serverName;
      } else {
        return characterName;
      }
    }

    function addAllSenders(lines) {
      senders.splice(0, senders.length);
      for (const line of lines) {
        let sender = senders.find((s) => s.name === line.sender);
        if (!sender) {
          const senderClass = getSenderClass(line.sender);
          sender = {
            name: line.sender,
            count: 0,
            visible: true,
            class: senderClass,
          };
          senders.push(sender);
        }
        line.senderReference = sender;
        sender.count++;
      }
    }

    function getJosa(name, josaType) {
      // 이름 마지막 글자의 받침 여부로 조사 결정
      // 영문 이름은 받침 없음으로 처리
      const last = name[name.length - 1];
      const code = last ? last.charCodeAt(0) : 0;
      let hasBatchim = false;
      if (code >= 0xAC00 && code <= 0xD7A3) {
        hasBatchim = (code - 0xAC00) % 28 !== 0;
      }
      switch (josaType) {
        case '이가': return hasBatchim ? '이' : '가';
        case '은는': return hasBatchim ? '은' : '는';
        case '을를': return hasBatchim ? '을' : '를';
        case '와과': return hasBatchim ? '과' : '와';
        case '이': return hasBatchim ? '이' : '';  // 이/없음 (이름+이 붙는 경우)
        default: return josaType;
      }
    }

    function getSenderClass(sender) {
      // 한글·특수문자 등 모든 문자를 안전하게 처리: 각 문자를 유니코드 코드포인트로 변환
      return 's-' + Array.from(sender).map(c => {
        const code = c.codePointAt(0);
        // 영문 소문자·숫자·하이픈은 그대로, 나머지는 u{코드} 형태로 변환
        if ((code >= 97 && code <= 122) || (code >= 48 && code <= 57)) return c;
        if (c === ' ') return '-';
        return 'u' + code;
      }).join('');
    }

    function generateOutput(lines) {
      const parsedLogElement = document.querySelector('.parsed-log');
      
      const filteredLines = lines.filter(line => {
        if (!messageTypes[line.code] || !messageTypes[line.code].visible) return false;
        if (!line.senderReference?.visible) return false;
        
        if (startTimeFilter && endTimeFilter) {
          if (startTimeFilter <= endTimeFilter) {
            if (line.time < startTimeFilter || line.time > endTimeFilter) return false;
          } else {
            if (line.time < startTimeFilter && line.time > endTimeFilter) return false;
          }
        } else if (startTimeFilter) {
          if (line.time < startTimeFilter) return false;
        } else if (endTimeFilter) {
          if (line.time > endTimeFilter) return false;
        }
        return true;
      });

      const outputElement = document.getElementById('output');
      const fragment = document.createDocumentFragment();
      
      let lastSender = null;

      for (const line of filteredLines) {
        const lineElement = createLineElement(line);
        // compact 비교: 서버명을 제거한 순수 캐릭터 이름 기준
        // 001d의 sender는 서버명 없이 저장되므로, 일반 채팅(서버명 포함)과 맞추려면 벗겨서 비교
        const compareSender = line.sender ? getDisplaySenderName(line.sender).replace(/@.*$/, '') : '';
        if (isCompactMode) {
          if (lastSender === compareSender) {
            lineElement.classList.add('compact-same');
          } else {
            lineElement.classList.add('compact-diff');
          }
        }
        lastSender = compareSender;
        fragment.appendChild(lineElement);
      }

      while (outputElement.firstChild) {
        outputElement.removeChild(outputElement.firstChild);
      }
      outputElement.appendChild(fragment);
      parsedLogElement.style.display = '';

      updateSearchHighlights();
      updateColours();
      dirtySaveAsAndTryUpdate();
    }

    function createLineElement(line) {
      const codeDetail = messageTypes[line.code];
      const codeClass = codeDetail && codeDetail.class;
      const element = document.createElement('p');
      const prependSender = codeDetail && codeDetail.prependSender || '';
      const activeTransformers = transformTextRules.filter(r => r.active);
      const message = createLineMessage(line, activeTransformers);

      element.className = `line ${codeClass} ${line.senderReference.class}`;
      element.dataset['id'] = line.id;
      const isEmoteCustom = line.code === '001c';
      const isEmote = line.code === '001d';

      const timeHTML = showTimestamp ? `<span class="time">[${line.time}]</span>` : '';

      // 발신자 이름 처리: 원본 이름에 먼저 치환 적용 → 서버명 처리 → 아이콘 숨김
      let rawSender = line.sender;
      for (const [origName, rule] of Object.entries(nameReplacements)) {
        if (rule.active && origName && rule.newName) {
          const escaped = origName.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
          rawSender = rawSender.replace(new RegExp(escaped, 'g'), rule.newName);
        }
      }
      let displaySender = getDisplaySenderName(rawSender);
      if (hideNameIcons) {
        displaySender = displaySender.replace(/^[^a-zA-Z가-힣0-9]+/g, '');
      }

      // 001d 메시지 내 다른 캐릭터 이름도 nameReplacements 적용
      let processedMessage = message;
      if (isEmote || isEmoteCustom) {
        for (const [origName, rule] of Object.entries(nameReplacements)) {
          if (rule.active && origName && rule.newName) {
            // 메시지는 escapeHTML 처리된 상태이므로 이름도 HTML 이스케이프 후 매칭
            const htmlEscapedName = origName
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
            const htmlEscapedDisplay = getDisplaySenderName(origName)
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
            // &x27; 형태도 커버 (파싱 방식에 따라 다를 수 있음)
            const htmlEscapedNameAlt = origName
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');

            const newName = escapeHTML(rule.newName);
            for (const pattern of new Set([htmlEscapedName, htmlEscapedDisplay, htmlEscapedNameAlt])) {
              const escaped = pattern.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
              processedMessage = processedMessage.replace(new RegExp(escaped, 'g'), newName);
            }
          }
        }
      }

      // 001d: displaySender 기준으로 조사 재계산 (이름 변경 후 받침이 달라질 수 있음)
      // 001c: 메시지가 조사로 시작하면 displaySender에 맞게 교정
      let senderSuffix = '';
      if (isEmote) {
        // 원본 조사 타입 판별 후 displaySender 기준으로 재계산
        const origJosa = line.emoteJosa || '';
        if (origJosa === '이' || origJosa === '가') {
          senderSuffix = getJosa(displaySender, '이가');
        } else if (origJosa === '은' || origJosa === '는') {
          senderSuffix = getJosa(displaySender, '은는');
        } else if (origJosa === '을' || origJosa === '를') {
          senderSuffix = getJosa(displaySender, '을를');
        } else if (origJosa === '와' || origJosa === '과') {
          senderSuffix = getJosa(displaySender, '와과');
        } else {
          senderSuffix = origJosa;
        }
      } else if (isEmoteCustom) {
        // 001c 메시지 앞의 조사를 displaySender 기준으로 교정
        const josaMatch = processedMessage.match(/^(이|가|은|는|을|를|와|과|이가|은는|을를)/);
        if (josaMatch) {
          const origJosa = josaMatch[1];
          if (origJosa === '이' || origJosa === '가') {
            senderSuffix = getJosa(displaySender, '이가');
          } else if (origJosa === '은' || origJosa === '는') {
            senderSuffix = getJosa(displaySender, '은는');
          } else if (origJosa === '을' || origJosa === '를') {
            senderSuffix = getJosa(displaySender, '을를');
          } else if (origJosa === '와' || origJosa === '과') {
            senderSuffix = getJosa(displaySender, '와과');
          }
          // 메시지에서 앞의 조사 제거 (sender에 붙여서 출력)
          processedMessage = processedMessage.slice(origJosa.length);
        }
      }

      element.innerHTML =
        timeHTML +
        (isEmote && !displaySender
          ? ''
          : `<span class="sender">${prependSender}${displaySender}${isEmoteCustom ? senderSuffix : (isEmote ? senderSuffix : ':')}</span> `) +
        `<span class="message">${processedMessage}</span>`;
      return element;
    }

    function createCSS() {
      let css = '';
      for (const detail of messageTypesAsArray) {
        css += `.${detail.class} { color: ${detail.color}; }\n`;
      }
      for (const sender of customSenderColours) {
        css += `.${sender.class} { color: ${sender.customColor}; }\n`
      }
      return css;
    }

    function createLineMessage(line, activeTransformers) {
      let rawMessage = line.message;

      if (!activeTransformers?.length) return rawMessage;
      
      let message = rawMessage;
      for (const transformer of activeTransformers) {
        message = tryTransformText(message, transformer, line);
      }
      return message;
    }

    function tryTransformText(text, transformer, line) {
      let canTransform = false;
      for (const code of transformer.codes) {
        if (code === '*' || code === line.code) {
          canTransform = true;
          break;
        }
      }
      if (!canTransform) return text;

      const matchedText = getMatchedText(text, transformer);
      if (!matchedText?.length) return text;

      return transformer.method(matchedText, line);
    }

    function getMatchedText(text, transformer) {
      let matches;
      if (transformer.customMatcher) {
        matches = transformer.customMatcher(text, transformer);
      } else if (transformer.regex) {
        matches = [...text.matchAll(transformer.regex)];
        matches = matches.filter(m => m[0]);
      }
      if (!matches?.length) return undefined;

      let result = [];
      let currentIndex = 0;
      for (const match of matches) {
        const before = text.substr(currentIndex, match.index - currentIndex);
        if (before.length) {
          result.push({ text: before, transform: false });
        }
        result.push({ text: match[0], transform: true });
        currentIndex = match.index + match[0].length;
      }
      if (currentIndex < text.length) {
        result.push({ text: text.substr(currentIndex), transform: false });
      }
      return result;
    }

    function addCSS() {
      const styleElement = document.createElement("style");
      const css = createCSS();
      styleElement.appendChild(document.createTextNode(css));
      document.head.appendChild(styleElement);
      hasAddedCSS = true;
    }

    function updateColours() {
      const isWhiteMode = document.body.classList.contains('white-mode');
      for (const messageType of Object.values(messageTypes)) {
        let colorToApply = messageType.color;
        if (isWhiteMode && messageType.code === '000a') {
          colorToApply = '#000000';
        }
        const elements = document.querySelectorAll(`.${messageType.class}`);
        elements.forEach(el => { el.style.color = colorToApply; });
      }
      // 발신자 색상을 필터 타입 색상보다 나중에 덮어써서 우선 적용
      for (const sender of customSenderColours) {
        const elements = document.querySelectorAll(`.${sender.class}`);
        elements.forEach(el => { el.style.color = sender.customColor; });
      }
    }

    function clearObjectURLs() {
      for (const existingUrl of existingObjectURLs) {
        window.URL.revokeObjectURL(existingUrl);
      }
      existingObjectURLs = [];
    }

    function onMouseOverUpdateSaveAsbuttons() {
      if (!isSaveAsDirty) return;
      generateSaveAsButtons();
    }

    function dirtySaveAsAndTryUpdate() {
      isSaveAsDirty = true;
      if (alwaysUpdateBlobs) {
        generateSaveAsButtons();
      }
    }

    function generateSaveAsButtons() {
      isSaveAsDirty = false;
      clearObjectURLs();
      generateSaveAsHTML();
    }

    function generateSaveAsHTML() {
      const outputElement = document.getElementById('output');
      const saveAsHTMLAnchor = document.querySelector('.save-as-html');
      const output = getHTMLOutput(logFilename, outputElement.innerHTML);
      const blob = new Blob([output]);
      const url = window.URL.createObjectURL(blob);
      saveAsHTMLAnchor.href = url;
      saveAsHTMLAnchor.download = logFilename + '.html';
      existingObjectURLs.push(url);
    }

    function getHTMLOutput(filename, content) {
      const css = createCSS();
      const output = `
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>${filename}</title>
  <style>
body { background-color: hsl(0, 0%, 5%); color: hsl(0, 0%, 95%); }
body.white-mode { background-color: #ffffff !important; color: #000000 !important; }
body.white-mode #filter-popover { background-color: #222 !important; }
body.white-mode #filter-popover label, body.white-mode #filter-popover span { color: #ffffff !important; }
body.white-mode #filter-popover button { color: #000000 !important; background-color: #f0f0f0 !important; }
body.white-mode .save-as-html { color: #000000 !important; }
    ${css}
  </style>
</head>
<body>
  <div id="output">
    ${content}
  </div>
</body>
</html>`;
      return output;
    }

    function tryRemoveSelectedText(event) {
      if (event.key !== 'Delete' && event.key !== 'Backspace') return;

      const selection = document.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      const outputElement = document.getElementById('output');
      
      if (!outputElement.contains(range.commonAncestorContainer)) return;

      const focusLine = getLineElementFromSelectionNode(selection.focusNode);
      const anchorLine = getLineElementFromSelectionNode(selection.anchorNode);
      if (!focusLine || !anchorLine) return;

      const idsToRemove = new Set();
      let isBetween = false;
      const allLines = Array.from(outputElement.children);

      for (const line of allLines) {
        if (line === focusLine || line === anchorLine) {
          if (!isBetween) {
            isBetween = true;
            idsToRemove.add(line.dataset['id']);
            if (focusLine === anchorLine) break; 
            continue;
          } else {
            idsToRemove.add(line.dataset['id']);
            break;
          }
        }
        if (isBetween) idsToRemove.add(line.dataset['id']);
      }

      const removedLines = currentParsedLines.filter(line => idsToRemove.has(line.id));
      currentParsedLines = currentParsedLines.filter(line => !idsToRemove.has(line.id));

      if (removedLines.length > 0) {
        deletedLinesStack.push(removedLines);
        updateUndoCounter();
        // id → element Map으로 한 번에 조회 (querySelector 반복보다 빠름)
        const lineMap = new Map(
          Array.from(outputElement.children).map(el => [el.dataset['id'], el])
        );
        for (const id of idsToRemove) {
          const el = lineMap.get(id);
          if (el) el.remove();
        }
        dirtySaveAsAndTryUpdate();
      }
    }

    function getLineElementFromSelectionNode(node) {
      while (node && node.parentNode) {
        if (node.classList?.contains('line')) return node;
        node = node.parentNode;
      }
      return undefined;
    }
  })();
  // =======================================================================
// [추가 기능] 에디터별 맞춤 복사 시스템
// =======================================================================
window.addEventListener('DOMContentLoaded', () => {
  // --- 플랫폼별 클립보드 커스텀 복사 로직 ---
  function handleCopyForPlatform(platform) {
    const targetOutput = document.getElementById('output') || (typeof outputElement !== 'undefined' ? outputElement : null);
    if (!targetOutput) {
      alert('출력 영역을 찾을 수 없습니다.');
      return;
    }

    const selection = window.getSelection();
    let selectedLines = [];
    
    // 사용자 마우스 드래그 영역 확인
    if (selection && !selection.isCollapsed && targetOutput.contains(selection.commonAncestorContainer)) {
      const allLines = Array.from(targetOutput.querySelectorAll('.line'));
      allLines.forEach(line => {
        if (selection.containsNode(line, true)) {
          selectedLines.push(line);
        }
      });
      if (selectedLines.length === 0) {
        let node = selection.anchorNode;
        while (node && node !== targetOutput) {
          if (node.classList && node.classList.contains('line')) {
            selectedLines.push(node);
            break;
          }
          node = node.parentNode;
        }
      }
    }
    
    // 선택 영역이 없으면 전체 복사
    if (selectedLines.length === 0) {
      selectedLines = Array.from(targetOutput.querySelectorAll('.line'));
    }

    if (selectedLines.length === 0) {
      alert('복사할 데이터가 없습니다.');
      return;
    }

    const classToColor = {};
    if (typeof messageTypes !== 'undefined') {
      Object.values(messageTypes).forEach(t => {
        classToColor[t.class] = t.color;
      });
    }

    const compactFlag = typeof isCompactMode !== 'undefined' ? isCompactMode : false;
    let htmlResult = "";
    let plainTextResult = "";

    if (platform === 'gdocs') {
      // 구글 문서: 개별 div 블록 마진 제어 구조
      htmlResult = "<div>";
      selectedLines.forEach(line => {
        const clone = line.cloneNode(true);
        const allEls = [clone, ...Array.from(clone.querySelectorAll('*'))];
        allEls.forEach(el => {
          if (!el.classList) return;
          if (el.classList.contains('sender')) el.style.fontWeight = 'bold';
          for (const cls of Array.from(el.classList)) {
            if (classToColor[cls]) el.style.color = classToColor[cls];
          }
        });

        let marginStyle = "margin: 6px 0;";
        if (compactFlag) {
          if (clone.classList.contains('compact-same')) {
            marginStyle = "margin: 1px 0;";
          } else if (clone.classList.contains('compact-diff')) {
            marginStyle = "margin-top: 10px; margin-bottom: 1px;";
          }
        }
        htmlResult += `<div style="${marginStyle} font-family: Arial, sans-serif;">${clone.innerHTML}</div>`;
        plainTextResult += line.textContent + "\n";
      });
      htmlResult += "</div>";
    } else if (platform === 'upnote') {
      // UpNote: 통합 단일 박스 및 내부 <br> 분기 구조 (벌어짐 방지)
      htmlResult = "<div style='font-family: Arial, sans-serif;'>";
      selectedLines.forEach((line, index) => {
        const clone = line.cloneNode(true);
        const allEls = [clone, ...Array.from(clone.querySelectorAll('*'))];
        allEls.forEach(el => {
          if (!el.classList) return;
          if (el.classList.contains('sender')) el.style.fontWeight = 'bold';
          for (const cls of Array.from(el.classList)) {
            if (classToColor[cls]) el.style.color = classToColor[cls];
          }
        });

        if (index > 0) {
          if (compactFlag && line.classList.contains('compact-same')) {
            htmlResult += "<br>";
          } else {
            htmlResult += "<br><br>";
          }
        }
        htmlResult += clone.innerHTML;
        plainTextResult += line.textContent + "\n";
      });
      htmlResult += "</div>";
    }

    // 최신 Clipboard API 주입 시도
    if (navigator.clipboard && navigator.clipboard.write) {
      const htmlBlob = new Blob([htmlResult], { type: 'text/html' });
      const plainBlob = new Blob([plainTextResult], { type: 'text/plain' });
      navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': plainBlob })])
        .then(() => alert('양식이 유지되도록 클립보드에 복사되었습니다!'))
        .catch(() => fallbackCopy(htmlResult, plainTextResult));
    } else {
      fallbackCopy(htmlResult, plainTextResult);
    }
  }

  function fallbackCopy(htmlContent, plainTextContent) {
    const listener = (e) => {
      e.clipboardData.setData('text/html', htmlContent);
      e.clipboardData.setData('text/plain', plainTextContent);
      e.preventDefault();
    };
    document.addEventListener('copy', listener);
    document.execCommand('copy');
    document.removeEventListener('copy', listener);
    alert('클립보드에 복사되었습니다.');
  }
});
</script>
</body>
</html>
