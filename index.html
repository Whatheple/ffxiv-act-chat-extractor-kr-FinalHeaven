<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A chat parser for Final Fantasy XIV Online with the Advanced Combat Tracker (ACT) plugin." />
  <title>Nuu FFXIV ACT Plugin Chat Extractor</title>
  <style type="text/css">
    :root {
      --color-light-hsl: hsl(0, 0%, 95%);
      --color-light-highlight-hsl: hsl(0, 0%, 90%);
      --color-dark-hsl: hsl(0, 0%, 5%);
      --color-popover-background: hsl(0, 0%, 10%);
      --color-dark-highlight-hsl: hsl(0, 0%, 15%);
      --color-width: 20px;

      /* FF14 테마 변수 (어둠 테마 = 기본값) */
      --ff14-gold: #c8a84b;
      --ff14-gold-light: #e8d08a;
      --ff14-gold-dark: #8a6f2e;
      --ff14-bg: #1a1510;
      --ff14-bg-panel: rgba(12, 10, 7, 0.97);
      --ff14-bg-hover: rgba(200, 168, 75, 0.12);
      --ff14-border: #c8a84b;
      --ff14-text: #e8dfc8;
      --ff14-text-dim: #a09070;

      /* 테마 전환용 확장 변수 (버튼/패널/스크롤바 등 세부 그라데이션) */
      --theme-accent-rgb: 200, 168, 75;
      --theme-body-bg: #0d0d0d;
      --theme-body-text: #d0c8b0;
      --theme-scroll-track: #0e0c08;
      --theme-scroll-track-border: #2a2010;
      --theme-scroll-thumb-grad: linear-gradient(180deg, #8a6f2e 0%, #c8a84b 50%, #8a6f2e 100%);
      --theme-scroll-thumb-hover-grad: linear-gradient(180deg, #c8a84b 0%, #e8d08a 50%, #c8a84b 100%);
      --theme-toolbar-grad: linear-gradient(180deg, #1e1a12 0%, #0e0c08 100%);
      --theme-button-grad: linear-gradient(180deg, #2a2318 0%, #1a1510 100%);
      --theme-button-hover-grad: linear-gradient(180deg, #3a3020 0%, #252010 100%);
      --theme-button-active-grad: linear-gradient(180deg, #1a1510 0%, #0e0c08 100%);
      --theme-popover-grad: linear-gradient(160deg, #1e1a12 0%, #0e0c08 100%);
      --theme-panel-grad: linear-gradient(160deg, #1a1610 0%, #0e0c08 100%);
      --theme-panel-glow: #0a0806;
      --theme-input-bg: rgba(10, 8, 5, 0.8);
      --theme-color-input-bg: #0e0c08;
      /* 패널 배경 위에 직접 얹히는 강조 텍스트(헤더/링크) 전용 — 밝은 배경 테마에서 본문 텍스트와 별도로 필요 */
      --theme-panel-accent-text: #e8d08a;
    }

    html.theme-classic {
      /* 고전 테마 (파판 파판 견본 스타일: 인디고/보라 바탕 + 페리윙클 블루 강조) */
      /* html 요소에 지정해야 html::-webkit-scrollbar-* (페이지 스크롤바)도 변수를 상속받음 */
      --ff14-gold: #8ea4ff;
      --ff14-gold-light: #d0d8ff;
      --ff14-gold-dark: #4d3fc2;
      --ff14-bg: #2700a0;
      --ff14-bg-panel: rgba(21, 10, 74, 0.97);
      --ff14-bg-hover: rgba(100, 131, 252, 0.18);
      --ff14-border: #8ea4ff;
      --ff14-text: #eef0ff;
      --ff14-text-dim: #b3b0e0;

      --theme-accent-rgb: 100, 131, 252;
      --theme-body-bg: #150a4a;
      --theme-body-text: #eef0ff;
      --theme-scroll-track: #0d0633;
      --theme-scroll-track-border: #241269;
      --theme-scroll-thumb-grad: linear-gradient(180deg, #4d3fc2 0%, #6483fc 50%, #4d3fc2 100%);
      --theme-scroll-thumb-hover-grad: linear-gradient(180deg, #6483fc 0%, #d0d8ff 50%, #6483fc 100%);
      --theme-toolbar-grad: linear-gradient(180deg, #241269 0%, #0d0633 100%);
      --theme-button-grad: linear-gradient(180deg, #4a3fc0 0%, #241269 100%);
      --theme-button-hover-grad: linear-gradient(180deg, #6483fc 0%, #4a3fc0 100%);
      --theme-button-active-grad: linear-gradient(180deg, #241269 0%, #0d0633 100%);
      --theme-popover-grad: linear-gradient(160deg, #241269 0%, #0d0633 100%);
      --theme-panel-grad: linear-gradient(160deg, #2700a0 0%, #150a4a 100%);
      --theme-panel-glow: #0d0633;
      --theme-input-bg: rgba(13, 6, 51, 0.8);
      --theme-color-input-bg: #0d0633;
      --theme-panel-accent-text: #d0d8ff;
    }

    html.theme-light {
      /* 빛 테마 (양피지/가죽 견본 스타일: 크림색 파치먼트 바탕 + 어두운 갈색 탭/버튼 강조) */
      --ff14-gold: #8a6a45;
      --ff14-gold-light: #f7ecd8;
      --ff14-gold-dark: #5a4530;
      --ff14-bg: #f0d8b0;
      --ff14-bg-panel: rgba(247, 221, 184, 0.97);
      --ff14-bg-hover: rgba(138, 106, 69, 0.14);
      --ff14-border: #8a6a45;
      --ff14-text: #3c2a1f;
      --ff14-text-dim: #7a6248;

      --theme-accent-rgb: 138, 106, 69;
      --theme-body-bg: #f0d8b0;
      --theme-body-text: #3c2a1f;
      --theme-scroll-track: #d9bd8f;
      --theme-scroll-track-border: #8a6a45;
      --theme-scroll-thumb-grad: linear-gradient(180deg, #6b4e34 0%, #8a6a45 50%, #6b4e34 100%);
      --theme-scroll-thumb-hover-grad: linear-gradient(180deg, #8a6a45 0%, #c9a468 50%, #8a6a45 100%);
      --theme-toolbar-grad: linear-gradient(180deg, #f5d9ac 0%, #ecd0a0 100%);
      --theme-button-grad: linear-gradient(180deg, #8a6a4a 0%, #6b4e34 100%);
      --theme-button-hover-grad: linear-gradient(180deg, #a3835c 0%, #7a5d40 100%);
      --theme-button-active-grad: linear-gradient(180deg, #5a4530 0%, #4a3520 100%);
      --theme-popover-grad: linear-gradient(160deg, #f7ddb8 0%, #ecd0a0 100%);
      --theme-panel-grad: linear-gradient(160deg, #f7ddb8 0%, #ecd0a0 100%);
      --theme-panel-glow: #c9a468;
      --theme-input-bg: rgba(255, 250, 240, 0.85);
      --theme-color-input-bg: #ecd0a0;
      /* 파치먼트(밝은) 배경 위 헤더/링크용 — 흰색 대신 진한 갈색으로 가독성 확보 */
      --theme-panel-accent-text: #6b4e34;
    }

    a {
      color: var(--color-light-hsl);
      cursor: pointer;
    }

    a:hover {
      color: var(--color-light-highlight-hsl);
    }

    .save-as {
      display: flex;
      align-items: center;
      font-weight: bold;
      gap: 1rem;
    }

    .filter {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 500px;
    }


    #filter-popover {
      position: fixed;
      z-index: 200;
      width: max-content;
      min-width: 200px;
      max-width: 480px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.5rem 0.75rem;
      background-color: var(--color-popover-background);
      border: 1px solid var(--color-light-hsl);
      box-shadow: 5px 5px 15px 5px hsla(0, 0%, 95%, 0.1);
    }

    .filter-types-toggle-container {
      display: flex;
      gap: 1rem;
      padding: 0.5rem 0;
      font-weight: bold;
      font-size: 0.85em;
    }

    .filter-types-toggle-container span {
      cursor: pointer;
    }

    .filter-types-toggle-container span:hover {
      text-decoration: underline;
      text-decoration-color: var(--color-light-hsl);
    }

    .hover-highlight {
      user-select: none;
    }

    .hover-highlight:hover {
      background-color: var(--color-dark-highlight-hsl);
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
    }
    input[type="color"]::-moz-color-swatch {
      border: none;
    }

    input[type=color] {
      width: var(--color-width);
      height: var(--color-width);
      border: 1px solid grey;
      cursor: pointer;
      padding: 0;
    }

    .filter-message-type-grid {
      display: grid;
      grid-template-columns: 1fr var(--color-width);
      grid-column-gap: 0.25em;
      margin-top: 0.25em;
      padding-right: 0.5rem;
    }

    .filter-message-type-grid input[type=color] {
      opacity: 0.2;
      transition: opacity 50ms ease-in;
    }

    .filter-message-type-grid:hover input[type=color] {
      opacity: 1;
    }

    .filter-message-type {
      cursor: pointer;
      display: block;
    }

    .filter-senders-container {
      display: flex;
      flex-direction: column;
    }

    .filter-sender {
      cursor: pointer;
    }

    .chat-settings-popover-container {
      margin-top: 0.5rem;
    }

    body {
      background-color: hsl(0, 0%, 5%);
      color: hsl(0, 0%, 95%);
      text-shadow: 1px 1px 0px rgba(64, 64, 64, 0.18);
      font-family: Arial;
      transition: background-color 0.2s, color 0.2s;
    }

    #output {
      padding: 0.5rem;
    }

    .line {
      margin: 0.5rem 0;
    }

    .line.compact-same {
      margin: 0.1rem 0 !important;
    }
    .line.compact-diff {
      margin: 1rem 0 0.1rem 0 !important;
    }

    .search-hit-line {
      border-left: 3px solid orange;
      background-color: rgba(255, 165, 0, 0.1);
      padding-left: 5px;
    }
    .search-hit-line.current-focus {
      background-color: rgba(255, 165, 0, 0.3);
      outline: 1px solid orange;
    }

    .sender {
      font-weight: bold;
    }

    body.white-mode {
      background-color: #ffffff !important;
      color: #000000 !important;
    }
    body.white-mode #filter-popover {
      background-color: var(--color-popover-background) !important;
      border: 1px solid #555 !important;
    }
    body.white-mode #filter-popover label,
    body.white-mode #filter-popover span,
    body.white-mode #filter-popover p {
      color: #ffffff !important;
    }
    body.white-mode #filter-popover button {
      color: #000000 !important;
      background-color: #f0f0f0 !important;
    }
    body.white-mode .save-as-html, body.white-mode #undo-btn {
      color: #000000 !important;
    }
    body.white-mode .say {
      color: #000000 !important;
    }
    body.white-mode .search-hit-line {
      background-color: rgba(255, 165, 0, 0.2);
    }
    body.white-mode .sticky-toolbar {
      background-color: #ffffff !important;
    }

    /* ── FF14 스크롤바 — 전체 페이지 (크게) ── */
    /* Chrome/Edge: html에 명시해야 페이지 스크롤바에 적용됨 */
    html::-webkit-scrollbar {
      width: 24px;
      height: 24px;
    }
    html::-webkit-scrollbar-track {
      background: var(--theme-scroll-track);
      border-left: 1px solid var(--theme-scroll-track-border);
    }
    html::-webkit-scrollbar-thumb {
      background: var(--theme-scroll-thumb-grad);
      border-radius: 0;
    }
    html::-webkit-scrollbar-thumb:hover {
      background: var(--theme-scroll-thumb-hover-grad);
    }
    html::-webkit-scrollbar-corner {
      background: var(--theme-scroll-track);
    }
    /* Firefox: auto여야 width 지정이 의미있음 (thin은 브라우저 고정값) */
    html {
      scrollbar-width: auto;
      scrollbar-color: var(--ff14-gold-dark) var(--theme-scroll-track);
    }

    /* 팝오버 내부 스크롤바는 작게 */
    #filter-popover::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    #filter-popover::-webkit-scrollbar-track {
      background: var(--theme-scroll-track);
    }
    #filter-popover::-webkit-scrollbar-thumb {
      background: var(--theme-scroll-thumb-grad);
    }
    #filter-popover {
      scrollbar-width: thin;
      scrollbar-color: var(--ff14-gold-dark) var(--theme-scroll-track);
    }

    body.white-mode html { scrollbar-color: #c8a84b #ece4d0; }
    body.white-mode html::-webkit-scrollbar-track { background: #ece4d0; border-left: 1px solid #c8a84b; }
    body.white-mode html::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #c8a84b 0%, #e8d08a 50%, #c8a84b 100%); }
    .sticky-toolbar {
      background: var(--theme-toolbar-grad) !important;
      border-bottom: 1px solid var(--ff14-gold-dark);
      box-shadow: 0 2px 12px rgba(0,0,0,0.7), inset 0 -1px 0 rgba(var(--theme-accent-rgb),0.15);
      padding: 6px 10px !important;
      gap: 0.6rem !important;
    }

    /* 툴바 버튼 공통 — .filter button 대신 구체 클래스로 한정 */
    .sticky-toolbar button:not(.popover-close-button),
    .filter-types, .filter-senders, .sender-colours,
    .name-rename, .chat-settings, .filter-time, .theme-settings {
      background: var(--theme-button-grad);
      color: var(--ff14-gold-light);
      border: 1px solid var(--ff14-gold-dark);
      padding: 3px 10px;
      font-size: 0.82em;
      font-weight: bold;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .sticky-toolbar button:not(.popover-close-button):hover,
    .filter-types:hover, .filter-senders:hover, .sender-colours:hover,
    .name-rename:hover, .chat-settings:hover, .filter-time:hover, .theme-settings:hover {
      background: var(--theme-button-hover-grad);
      border-color: var(--ff14-gold);
      color: var(--ff14-gold-light);
      box-shadow: 0 0 6px rgba(var(--theme-accent-rgb),0.3), inset 0 0 8px rgba(var(--theme-accent-rgb),0.08);
    }

    .sticky-toolbar button:not(.popover-close-button):active,
    .filter-types:active, .filter-senders:active, .sender-colours:active,
    .name-rename:active, .chat-settings:active, .filter-time:active, .theme-settings:active {
      background: var(--theme-button-active-grad);
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.5);
    }

    /* 저장하기 링크를 버튼처럼 */
    .save-as-html {
      background: var(--theme-button-grad) !important;
      color: var(--ff14-gold-light) !important;
      border: 1px solid var(--ff14-gold-dark) !important;
      padding: 3px 10px !important;
      font-size: 0.82em !important;
      transition: background 0.15s, border-color 0.15s !important;
    }
    .save-as-html:hover {
      background: var(--theme-button-hover-grad) !important;
      border-color: var(--ff14-gold) !important;
      box-shadow: 0 0 6px rgba(var(--theme-accent-rgb),0.3) !important;
    }

    /* 되돌리기 링크 */
    #undo-btn {
      color: var(--theme-panel-accent-text) !important;
      font-size: 0.82em;
    }
    #undo-btn:hover { color: var(--ff14-gold) !important; }

    /* 검색 입력 */
    #search-input {
      background: var(--theme-input-bg) !important;
      color: var(--ff14-text) !important;
      border: 1px solid var(--ff14-gold-dark) !important;
      border-radius: 0 !important;
      padding: 3px 7px !important;
      font-size: 0.82em;
      outline: none;
      transition: border-color 0.15s;
    }
    #search-input:focus {
      border-color: var(--ff14-gold) !important;
      box-shadow: 0 0 5px rgba(var(--theme-accent-rgb),0.25);
    }
    #search-input::placeholder { color: var(--ff14-text-dim); }
    #search-counter { color: var(--ff14-text-dim); font-size: 0.8em; }

    /* 복사 포맷 고정 박스 */
    .sticky-toolbar [style*="복사 포맷"] {
      border-color: var(--ff14-gold-dark) !important;
    }

    /* 팝오버 FF14 스타일 — position:fixed는 기존 규칙(line 53)에서 유지 */
    #filter-popover {
      background: var(--theme-popover-grad) !important;
      border: 1px solid var(--ff14-gold-dark) !important;
      box-shadow: 0 4px 24px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(var(--theme-accent-rgb),0.07) !important;
      font-size: 0.96em;
    }

    /* 팝오버 닫기 버튼 */
    .popover-close-button {
      width: 100%;
      margin-bottom: 6px;
    }

    /* hover-highlight FF14 스타일 */
    .hover-highlight:hover {
      background-color: var(--ff14-bg-hover) !important;
    }

    /* 팝오버 내부 텍스트 크기 통일 (시간 필터링 기준보다 살짝 작게) */
    #filter-popover label,
    #filter-popover span:not(.remove-single-replace),
    #filter-popover p,
    #filter-popover .filter-message-type,
    #filter-popover .hover-highlight {
      font-size: 0.96em !important;
    }
    /* 팝오버 내 텍스트 색상 */
    #filter-popover label,
    #filter-popover span,
    #filter-popover p {
      color: var(--ff14-text);
    }

    /* 구분선 느낌 — 팝오버 내 단락 */
    #filter-popover p {
      border-bottom: 1px solid var(--ff14-gold-dark);
      padding-bottom: 4px;
      margin-bottom: 4px;
      font-size: 0.82em;
      color: var(--ff14-text-dim);
    }

    /* radio / checkbox 색상 */
    .sticky-toolbar input[type="radio"],
    .sticky-toolbar input[type="checkbox"] {
      accent-color: var(--ff14-gold);
    }
    #filter-popover input[type="radio"],
    #filter-popover input[type="checkbox"] {
      accent-color: var(--ff14-gold);
    }

    /* ── 반응형 ── */
    @media (max-width: 600px) {
      .log-parser { padding: 8px 10px; margin: 4px; }
      .sticky-toolbar {
        gap: 0.4rem !important;
        padding: 5px 8px !important;
        flex-wrap: wrap !important;
      }
      .filter { flex-wrap: wrap !important; max-width: 100% !important; }
      .filter-types, .filter-senders, .sender-colours,
      .name-rename, .chat-settings, .filter-time, .theme-settings {
        font-size: 0.75em !important;
        padding: 3px 6px !important;
      }
      #search-input { width: 120px !important; }
      #filter-popover {
        max-width: calc(100vw - 16px) !important;
        left: 8px !important;
      }
      .save-as-html { font-size: 0.78em !important; padding: 3px 6px !important; }
      #output { padding: 2px 6px; }
      .line { word-break: break-word; }
    }

    /* ── FF14: body 기본 ── */
    body {
      background-color: var(--theme-body-bg);
      color: var(--theme-body-text);
      font-family: 'Segoe UI', 'Meiryo', 'Noto Sans KR', sans-serif;
      /* 창 너비에 비례해 폰트 크기 자동 조정: 300px에서 12px ~ 1200px에서 16px */
      font-size: clamp(12px, 1vw + 11px, 16px);
    }

    /* ── 로그 파서 영역 ── */
    .log-parser {
      padding: 6px 10px;
      background: var(--theme-panel-grad);
      border: 1px solid var(--ff14-gold-dark);
      margin: 12px;
      box-shadow: 0 0 0 1px var(--theme-panel-glow), 0 4px 20px rgba(0,0,0,0.7);
      position: relative;
    }
    /* 모서리 장식 */
    .log-parser::before,
    .log-parser::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      border-color: var(--ff14-gold);
      border-style: solid;
    }
    .log-parser::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .log-parser::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .log-parser h1 {
      color: var(--theme-panel-accent-text);
      font-size: 1em;
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px rgba(var(--theme-accent-rgb),0.4);
      border-bottom: 1px solid var(--ff14-gold-dark);
      padding-bottom: 6px;
      margin-bottom: 8px !important;
    }
    .log-parser p {
      color: var(--ff14-text-dim);
      font-size: 0.82em;
      margin-bottom: 3px !important;
    }

    /* ── 파일 입력 버튼 ── */
    #loginput {
      background: var(--theme-button-grad);
      color: var(--ff14-gold-light);
      border: 1px solid var(--ff14-gold-dark);
      padding: 4px 12px;
      font-size: 0.85em;
      cursor: pointer;
    }
    #loginput:hover {
      background: var(--theme-button-hover-grad);
      border-color: var(--ff14-gold);
    }
    #loginput::file-selector-button {
      background: transparent;
      color: var(--ff14-gold-light);
      border: none;
      font-size: 0.85em;
      cursor: pointer;
      padding: 0 8px 0 0;
    }

    /* ── 에러 텍스트 ── */
    #error { color: #e04040; font-size: 0.85em; }

    /* ── 툴바 인라인 스타일 override ── */
    .sticky-toolbar {
      background: var(--theme-toolbar-grad) !important;

    // 발신자별 표시여부/커스텀 색상 — nameReplacements와 동일하게 이름 기준으로 세션/로그를 넘나들며 누적됨
    const senderPreferences = {}; // { 원본이름: { visible, customColor, colorEnabled } }

    window.addEventListener('DOMContentLoaded', () => {
      // 저장된 필터 타입/발신자 색상/이름 변경 등 사용자 설정 복원 (테마 적용보다 먼저)
      loadUserSettings();

      const logInput = document.getElementById('loginput');
      errorElement = document.getElementById('error');
      const filterRootElement = document.querySelector('.filter');

      filterRootElement.querySelector('.filter-types').addEventListener('click', showFilterTypes);
      filterRootElement.querySelector('.filter-senders').addEventListener('click', showFilterSenders);
      filterRootElement.querySelector('.sender-colours').addEventListener('click', showSenderColours);
      filterRootElement.querySelector('.name-rename').addEventListener('click', showNameRename);
      filterRootElement.querySelector('.chat-settings').addEventListener('click', showChatSettings);
      filterRootElement.querySelector('.filter-time').addEventListener('click', showFilterTime);
      filterRootElement.querySelector('.theme-settings').addEventListener('click', showThemeSettings);

      // 저장된 UI 테마 적용 (기본값: 어둠 테마)
      const savedUiTheme = localStorage.getItem('ffxiv-ui-theme') || 'dark';
      applyUiTheme(savedUiTheme);

      filterPopoverElement = document.getElementById('filter-popover');
      filterPopoverElement.querySelector('.popover-close-button').addEventListener('click', closeFilterPopover);

      logInput.addEventListener('change', handleLogUpload, false);

      // 팝오버는 닫기 버튼으로만 닫힘 (외부 클릭 닫기 비활성화)
      document.addEventListener('keydown', (event) => tryRemoveSelectedText(event));

      // 스크롤 시 팝오버 위치 실시간 갱신 (sticky 툴바 위치 변화 반영)
      window.addEventListener('scroll', () => {
        // 맨 위로 버튼 표시/숨김
        const scrollBtn = document.getElementById('scroll-to-top');
        if (scrollBtn) scrollBtn.style.display = window.scrollY > 300 ? '' : 'none';

        if (lastPopoverOpener === '') return;
        const filterRootEl = document.querySelector('.filter');
        if (!filterRootEl) return;
        const filterBounds = filterRootEl.getBoundingClientRect();
        const topPos = filterBounds.bottom + 5;
        filterPopoverElement.style.top = `${topPos}px`;
        filterPopoverElement.style.maxHeight = `${window.innerHeight - topPos - 20}px`;
        // 좌우 경계 재보정
        const margin = 32;
        const popoverWidth = filterPopoverElement.offsetWidth;
        let left = parseFloat(filterPopoverElement.style.left) || 0;
        if (left + popoverWidth + margin > window.innerWidth) {
          left = window.innerWidth - popoverWidth - margin;
        }
        if (left < margin) left = margin;
        filterPopoverElement.style.left = `${left}px`;
      }, { passive: true });

      const undoBtn = document.getElementById('undo-btn');
      undoBtn.addEventListener('click', () => {
        if (deletedLinesStack.length === 0) return;
        const restoredLines = deletedLinesStack.pop();
        currentParsedLines.push(...restoredLines);
        currentParsedLines.sort((a, b) => Number(a.id) - Number(b.id));
        updateUndoCounter();
        generateOutput(currentParsedLines);
      });

      document.getElementById('compact-toggle').addEventListener('change', (e) => {
        isCompactMode = e.target.checked;
        generateOutput(currentParsedLines);
      });

      // [추가] 복사 포맷 고정 설정 기억 (localStorage)
      const savedCopyTarget = localStorage.getItem('ffxiv-copy-target') || 'upnote';
      const targetRadio = document.querySelector(`input[name="copy-target"][value="${savedCopyTarget}"]`);
      if (targetRadio) targetRadio.checked = true;

      document.querySelectorAll('input[name="copy-target"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          localStorage.setItem('ffxiv-copy-target', e.target.value);
        });
      });

      document.getElementById('save-as-txt').addEventListener('click', () => {
          const baseName = (logFilename || 'chat').replace(/\.(html|txt)$/i, '');
          const inputName = prompt('저장할 파일명을 입력하세요:', baseName + '.txt');
          if (inputName === null) return;
          const finalName = inputName.trim() || baseName + '.txt';
          const downloadName = finalName.endsWith('.txt') ? finalName : finalName + '.txt';
          const blob = new Blob([getTXTOutput()], { type: 'text/plain;charset=utf-8' });
          const url = window.URL.createObjectURL(blob);
          const tempA = document.createElement('a');
          tempA.href = url;
          tempA.download = downloadName;
          document.body.appendChild(tempA);
          tempA.click();
          document.body.removeChild(tempA);
          window.URL.revokeObjectURL(url);
        });

      document.getElementById('copy-now-btn').addEventListener('click', () => {
        const platform = document.querySelector('input[name="copy-target"]:checked')?.value || 'upnote';
        handleCopyForPlatform(platform);
      });

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        currentSearchIndex = -1;
        updateSearchHighlights();
      });

      // [변경] 고정된 설정에 따라 선택 영역만 맞춤 복사하는 로직
      document.addEventListener('copy', (e) => {
        const selection = document.getSelection();
        if (!selection.rangeCount) return;

        const outputElement = document.getElementById('output');
        // 마우스 선택 영역이 채팅 출력창 내부일 때만 커스텀 복사 작동
        if (!outputElement || !outputElement.contains(selection.anchorNode)) return;

        const container = document.createElement('div');
        for (let i = 0; i < selection.rangeCount; i++) {
           container.appendChild(selection.getRangeAt(i).cloneContents());
        }

        const lines = container.querySelectorAll('.line');
        if (lines.length > 0) {
           e.preventDefault();
           
           // 현재 고정(체크)된 복사 대상 플랫폼 확인
           const copyTarget = document.querySelector('input[name="copy-target"]:checked')?.value || 'upnote';
           
           let htmlContent = "";
           let plainText = "";

           if (copyTarget === 'gdocs') {
              // 1) 구글 문서 최적화 포맷
              // 구글 문서는 문단(<p>) 구분을 확실히 해주고, 같은 발신자 대사는 내부 <br>로 이어주어야 여백이 깔끔합니다.
              htmlContent = "<div style='font-family: Arial, sans-serif;'>";
              let currentPara = "";
              
              lines.forEach((line, index) => {
                 const sender = line.querySelector('.sender')?.textContent || "";
                 const message = line.querySelector('.message')?.textContent || "";
                 
                 if (index === 0) {
                    currentPara = `<p style="margin: 0 0 6px 0;"><b>${sender}</b> ${message}`;
                    plainText += `${sender} ${message}`;
                 } else {
                    if (line.classList.contains('compact-same')) {
                       currentPara += `<br>${message}`;
                       plainText += `\n${message}`;
                    } else {
                       currentPara += "</p>";
                       htmlContent += currentPara;
                       currentPara = `<p style="margin: 6px 0 6px 0;"><b>${sender}</b> ${message}`;
                       plainText += `\n\n${sender} ${message}`;
                    }
                 }
              });
              currentPara += "</p>";
              htmlContent += currentPara + "</div>";
           } else {
              // 2) UpNote 최적화 포맷
              // UpNote는 줄바꿈 테그(<br>)를 직관적으로 잘 인식하므로 기존 줄바꿈 형태를 유지합니다.
              htmlContent = "<div>";
              lines.forEach((line, index) => {
                 const sender = line.querySelector('.sender')?.textContent || "";
                 const message = line.querySelector('.message')?.textContent || "";
                 
                 if (index > 0) {
                    if (line.classList.contains('compact-same')) {
                       htmlContent += "<br>";
                       plainText += `\n`;
                    } else {
                       htmlContent += "<br><br>";
                       plainText += `\n\n`;
                    }
                 }
                 htmlContent += `<b>${sender}</b> ${message}`;
                 plainText += `${sender} ${message}`;
              });
              htmlContent += "</div>";
           }

           e.clipboardData.setData('text/html', htmlContent);
           e.clipboardData.setData('text/plain', plainText);
        }
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && searchMatches.length > 0) {
          e.preventDefault();
          if (currentSearchIndex >= 0 && searchMatches[currentSearchIndex]) {
            searchMatches[currentSearchIndex].classList.remove('current-focus');
          }
          currentSearchIndex = (currentSearchIndex + 1) % searchMatches.length;
          searchMatches[currentSearchIndex].classList.add('current-focus');
          searchMatches[currentSearchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
          updateSearchCounter();
        }
      });

      document.addEventListener('copy', (e) => {
        const selection = document.getSelection();
        if (!selection.rangeCount || !isCompactMode) return;

        const container = document.createElement('div');
        for (let i = 0; i < selection.rangeCount; i++) {
           container.appendChild(selection.getRangeAt(i).cloneContents());
        }

        const lines = container.querySelectorAll('.line');
        if (lines.length > 0) {
           e.preventDefault();
           let htmlContent = "<div>";

           lines.forEach((line, index) => {
              const sender = line.querySelector('.sender')?.textContent || "";
              const message = line.querySelector('.message')?.textContent || "";
              
              if (index > 0) {
                 if (line.classList.contains('compact-same')) {
                    htmlContent += "<br>"; 
                 } 
                 else {
                    htmlContent += "<br><br>";
                 }
              }

              htmlContent += `<b>${sender}</b> ${message}`;
           });
           
           htmlContent += "</div>";

           e.clipboardData.setData('text/html', htmlContent);
           e.clipboardData.setData('text/plain', selection.toString());
        }
      });

      // bg-color-picker 이벤트는 채팅 설정 팝오버 내부에서 처리됨 (applyBgColor 함수 사용)
      // compact-toggle (hidden, 동기화용)
      document.getElementById('compact-toggle').addEventListener('change', (e) => {
        isCompactMode = e.target.checked;
        generateOutput(currentParsedLines);
      });

      if (window.matchMedia('(any-hover: none)').matches) {
        alwaysUpdateBlobs = true;
      } else {
        const saveAsHTMLAnchor = document.querySelector('.save-as-html');
        saveAsHTMLAnchor.addEventListener('pointerover', () => {
          onMouseOverUpdateSaveAsbuttons();
        });
        saveAsHTMLAnchor.addEventListener('click', (e) => {
          e.preventDefault();
          if (isSaveAsDirty) generateSaveAsButtons();
          const baseName = (logFilename || 'chat').replace(/\.(html|txt)$/i, '');
          const inputName = prompt('저장할 파일명을 입력하세요:', baseName + '.html');
          if (inputName === null) return;
          const finalName = inputName.trim() || baseName + '.html';
          const downloadName = finalName.endsWith('.html') ? finalName : finalName + '.html';
          saveAsHTMLAnchor.download = downloadName;
          const tempA = document.createElement('a');
          tempA.href = saveAsHTMLAnchor.href;
          tempA.download = downloadName;
          document.body.appendChild(tempA);
          tempA.click();
          document.body.removeChild(tempA);
        });
      }
    });

    function applyBgColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const textColor = luminance > 0.5 ? '#000000' : '#ffffff';
      document.body.style.backgroundColor = hex;
      document.body.style.color = textColor;
      messageTypes['000a'].color = textColor;
      updateColours();
    }

    function resetBgColor() {
      // 배경색 직접 지정만 초기화하고 현재 UI 테마의 기본 배경/텍스트 색상을 복원
      document.body.style.backgroundColor = '';
      document.body.style.color = '';
      messageTypes['000a'].color = messageTypes['000a'].baseColor;
      updateColours();
    }

    function rgbToHex(rgb) {
      const m = rgb.match(/\d+/g);
      if (!m || m.length < 3) return '#0d0d0d';
      return '#' + m.slice(0, 3).map(n => parseInt(n).toString(16).padStart(2, '0')).join('');
    }

    // ── 로컬 저장 + 내보내기/불러오기: 필터 타입/발신자 색상/이름 변경 등 사용자 설정 ──
    // (시간 필터·검색어 등 로그별 임시 상태는 저장 대상에서 제외)
    const USER_SETTINGS_KEY = 'ffxiv-user-settings';

    function buildFullSettingsPayload() {
      const mt = {};
      for (const t of messageTypesAsArray) {
        mt[t.code] = { visible: t.visible, color: t.color, customized: !!t.customized };
      }
      return {
        version: 1,
        messageTypes: mt,
        // senderPreferences/nameReplacements는 이름 기준으로 계속 누적되는 저장소이므로 그대로 사용 —
        // 현재 불러온 로그에 없는 발신자의 설정도 내보내기에 함께 포함됨
        senderPrefs: senderPreferences,
        nameReplacements,
        transformRules: transformTextRules.map(r => r.active),
        isCompactMode, showTimestamp, showServerName, hideNameIcons,
        colorMode, colorModeForTypes, colorModeForSenders,
        bgColor: document.body.style.backgroundColor ? rgbToHex(document.body.style.backgroundColor) : null,
        uiTheme: getCurrentUiTheme(),
        copyTarget: localStorage.getItem('ffxiv-copy-target') || 'upnote',
      };
    }

    // saved 객체의 값들을 현재 상태에 "병합" 적용 (기존에 없던 항목은 유지, 겹치는 항목만 덮어씀)
    function applySettingsPayload(saved) {
      if (!saved || typeof saved !== 'object') return;

      if (saved.messageTypes && typeof saved.messageTypes === 'object') {
        for (const code in saved.messageTypes) {
          const t = messageTypes[code];
          const s = saved.messageTypes[code];
          if (!t || !s) continue;
          if (typeof s.visible === 'boolean') t.visible = s.visible;
          if (typeof s.color === 'string') t.color = s.color;
          if (typeof s.customized === 'boolean') t.customized = s.customized;
        }
      }
      if (saved.senderPrefs && typeof saved.senderPrefs === 'object') {
        for (const name in saved.senderPrefs) {
          senderPreferences[name] = { ...senderPreferences[name], ...saved.senderPrefs[name] };
        }
      }
      if (saved.nameReplacements && typeof saved.nameReplacements === 'object') {
        for (const name in saved.nameReplacements) {
          // 예전 백업은 서버명이 붙은 원본 이름으로 저장되어 있을 수 있으므로
          // 불러올 때 캐릭터 이름만 남긴 정규화 키로 병합한다.
          const normalizedName = getCharacterName(name);
          if (!normalizedName) continue;
          nameReplacements[normalizedName] = saved.nameReplacements[name];
        }
      }
      if (Array.isArray(saved.transformRules)) {
        saved.transformRules.forEach((active, i) => {
          if (transformTextRules[i] && typeof active === 'boolean') transformTextRules[i].active = active;
        });
      }
      if (typeof saved.isCompactMode === 'boolean') isCompactMode = saved.isCompactMode;
      if (typeof saved.showTimestamp === 'boolean') showTimestamp = saved.showTimestamp;
      if (typeof saved.showServerName === 'boolean') showServerName = saved.showServerName;
      if (typeof saved.hideNameIcons === 'boolean') hideNameIcons = saved.hideNameIcons;
      if (typeof saved.colorMode === 'string') colorMode = saved.colorMode;
      if (typeof saved.colorModeForTypes === 'boolean') colorModeForTypes = saved.colorModeForTypes;
      if (typeof saved.colorModeForSenders === 'boolean') colorModeForSenders = saved.colorModeForSenders;
      if (saved.bgColor) {
        applyBgColor(saved.bgColor);
      }
      if (typeof saved.uiTheme === 'string') {
        applyUiTheme(saved.uiTheme);
      }
      if (typeof saved.copyTarget === 'string') {
        localStorage.setItem('ffxiv-copy-target', saved.copyTarget);
        const radio = document.querySelector(`input[name="copy-target"][value="${saved.copyTarget}"]`);
        if (radio) radio.checked = true;
      }
      // 이미 로그가 열려 있으면 현재 발신자 목록에도 즉시 반영
      if (currentParsedLines.length) {
        applySenderPreferencesToCurrentSenders();
        generateOutput(currentParsedLines);
      } else {
        updateColours();
      }
    }

    function saveUserSettings() {
      try {
        localStorage.setItem(USER_SETTINGS_KEY, JSON.stringify(buildFullSettingsPayload()));
      } catch (e) {
        // localStorage 사용 불가(용량 초과, 프라이빗 모드 등) 시 조용히 무시
      }
    }

    function loadUserSettings() {
      let saved;
      try {
        const raw = localStorage.getItem(USER_SETTINGS_KEY);
        if (!raw) return;
        saved = JSON.parse(raw);
      } catch (e) {
        return;
      }
      applySettingsPayload(saved);
    }

    function resetAllSettings() {
      // 저장된 설정 전체 제거
      try {
        localStorage.removeItem(USER_SETTINGS_KEY);
        localStorage.removeItem('ffxiv-copy-target');
        localStorage.removeItem('ffxiv-ui-theme');
      } catch (e) {}

      // 발신자/이름 관련 설정 초기화
      for (const key of Object.keys(senderPreferences)) delete senderPreferences[key];
      for (const key of Object.keys(nameReplacements)) delete nameReplacements[key];
      customSenderColours.splice(0, customSenderColours.length);

      // 메시지 타입 설정 초기화
      for (const mt of messageTypesAsArray) {
        mt.visible = typeof mt.baseVisible === 'boolean' ? mt.baseVisible : mt.visible;
        mt.color = mt.baseColor;
        mt.customized = false;
      }

      // 텍스트 변환 규칙 / 채팅 설정 초기화
      transformTextRules.forEach(rule => { rule.active = true; });
      isCompactMode = false;
      showTimestamp = false;
      showServerName = false;
      hideNameIcons = false;
      colorMode = 'all';
      colorModeForTypes = true;
      colorModeForSenders = true;

      // 배경색/테마/복사 포맷 초기화
      document.body.style.backgroundColor = '';
      document.body.style.color = '';
      applyUiTheme('dark');
      messageTypes['000a'].color = messageTypes['000a'].baseColor;

      const radio = document.querySelector('input[name="copy-target"][value="upnote"]');
      document.querySelectorAll('input[name="copy-target"]').forEach(el => { el.checked = false; });
      if (radio) radio.checked = true;

      // 현재 로그가 열려 있다면 기본 설정을 즉시 반영
      if (currentParsedLines.length) {
        addAllSenders(currentParsedLines);
        generateOutput(currentParsedLines);
      } else {
        updateColours();
      }
      saveUserSettings();
    }

    function exportUserSettingsToFile() {
      const payload = buildFullSettingsPayload();
      const json = JSON.stringify(payload, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ffxiv-chat-extractor-settings.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => window.URL.revokeObjectURL(url), 1000);
    }

    function importUserSettingsFromFile(file, onDone) {
      const reader = new FileReader();
      reader.onload = () => {
        let parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (e) {
          onDone(false, '파일을 읽을 수 없습니다 (JSON 형식 아님)');
          return;
        }
        applySettingsPayload(parsed);
        saveUserSettings();
        onDone(true, '설정을 불러왔습니다');
      };
      reader.onerror = () => onDone(false, '파일을 읽는 중 오류가 발생했습니다');
      reader.readAsText(file);
    }

    function updateSearchHighlights() {
      searchMatches = [];
      const outputElement = document.getElementById('output');
      const lines = outputElement.querySelectorAll('.line');

      lines.forEach(lineEl => {
        lineEl.classList.remove('search-hit-line', 'current-focus');
        if (searchQuery) {
          const senderSpan = lineEl.querySelector('.sender');
          const messageSpan = lineEl.querySelector('.message');
          const senderText = senderSpan ? senderSpan.textContent.toLowerCase() : '';
          const messageText = messageSpan ? messageSpan.textContent.toLowerCase() : '';
          
          if ((senderText + " " + messageText).includes(searchQuery)) {
            lineEl.classList.add('search-hit-line');
            searchMatches.push(lineEl);
          }
        }
      });
      updateSearchCounter();
    }

    function updateUndoCounter() {
      const undoBtn = document.getElementById('undo-btn');
      if (deletedLinesStack.length > 0) {
        undoBtn.style.display = '';
        undoBtn.innerText = `되돌리기 (${deletedLinesStack.length})`;
      } else {
        undoBtn.style.display = 'none';
      }
    }

    function updateSearchCounter() {
      const counter = document.getElementById('search-counter');
      if (searchMatches.length > 0) {
        counter.innerText = `${currentSearchIndex >= 0 ? currentSearchIndex + 1 : 0}/${searchMatches.length}`;
      } else {
        counter.innerText = '0/0';
      }
    }

    // 서버 이름을 @포맷으로 반환하는 헬퍼 함수
    function formatSenderNameForMenu(sender) {
      const senderName = typeof sender === 'string' ? sender : sender.name;
      const serverRegex = /(Tonberry|Carbuncle|Chocobo|Moogle|Fenrir|톤베리|카벙클|초코보|모그리|펜리르)$/;
      const match = senderName.match(serverRegex);
      let displayName;
      if (match) {
        const serverName = match[0];
        const characterName = senderName.replace(serverRegex, '');
        displayName = characterName + '@' + serverName;
      } else {
        displayName = senderName;
      }
      return (typeof sender === 'string' || !sender.isNPC) ? displayName : `(NPC) ${displayName}`;
    }

    function showFilterTypes() {
      if (lastPopoverOpener === popoverOpeners.filterTypes) {
        closeFilterPopover();
        return;
      }
      const contentElement = showFilterPopoverAndGetContentElement(popoverOpeners.filterTypes);
      const fragment = document.createDocumentFragment();
      addTypesToggle(fragment, messageTypesAsArray, '.filter-message-type input[type=checkbox]');
      for (const messageType of messageTypesAsArray) {
        const gridContainer = document.createElement('div');
        gridContainer.className = 'filter-message-type-grid hover-highlight';
        const messageTypeElement = document.createElement('label');
        messageTypeElement.className = `filter-message-type ${messageType.class}`;
        messageTypeElement.innerHTML = `
          <input id="${messageType.code}" type="checkbox">

    function addTypesToggle(fragment, items, query, onVisibilityChange) {
      const toggleContainer = document.createElement('div');
      toggleContainer.className = 'filter-types-toggle-container';
      const allToggle = document.createElement('span');
      allToggle.innerText = 'All';
      allToggle.onclick = () => setVisibility(true);
      const noneToggle = document.createElement('span');
      noneToggle.innerText = 'None';
      noneToggle.onclick = () => setVisibility(false);
      toggleContainer.appendChild(allToggle);
      toggleContainer.appendChild(noneToggle);
      fragment.appendChild(toggleContainer);

      function setVisibility(visibility) {
        const popoverElement = document.getElementById('filter-popover');
        for (const item of items) {
          item.visible = visibility;
          if (onVisibilityChange) onVisibilityChange(item, visibility);
        }
        const inputElements = popoverElement.querySelectorAll(query);
        for (const element of inputElements) element.checked = visibility;
        generateOutput(currentParsedLines);
      }
    }

    function showFilterPopoverAndGetContentElement(opener) {
      clearFilterPopover();
      lastPopoverOpener = opener;
      const popoverContent = filterPopoverElement.querySelector('.filter-popover-content');
      const openerElement = document.querySelector(opener);
      if (!openerElement) {
        filterPopoverElement.style.display = '';
        return popoverContent;
      }

      // 내용 채우기 전에 hidden으로 열어둠 — 내용 추가 후 positionPopover()로 위치 확정
      filterPopoverElement.style.visibility = 'hidden';
      filterPopoverElement.style.display = '';
      // opener 버튼 위치를 data로 저장해 positionPopover에서 사용
      filterPopoverElement._openerBounds = openerElement.getBoundingClientRect();
      return popoverContent;
    }

    function positionPopover() {
      const filterRootElement = document.querySelector('.filter');
      if (!filterRootElement) return;
      const filterBounds = filterRootElement.getBoundingClientRect();
      const topPos = filterBounds.bottom + 5;
      const margin = 32;

      filterPopoverElement.style.top = `${topPos}px`;
      filterPopoverElement.style.maxHeight = `${window.innerHeight - topPos - 20}px`;

      // 내용이 채워진 뒤 실제 너비 측정
      const popoverWidth = filterPopoverElement.offsetWidth;
      const openerLeft = (filterPopoverElement._openerBounds?.left) ?? 0;
      let left = openerLeft;
      if (left + popoverWidth + margin > window.innerWidth) {
        left = window.innerWidth - popoverWidth - margin;
      }
      if (left < margin) left = margin;
      filterPopoverElement.style.left = `${left}px`;
      filterPopoverElement.style.visibility = '';
    }

    function closeFilterPopover() {
      lastPopoverOpener = '';
      const filterPopoverElement = document.getElementById('filter-popover');
      filterPopoverElement.style.display = 'none';
      const contentElement = filterPopoverElement.querySelector('.filter-popover-content');
      while (contentElement.firstChild) contentElement.removeChild(contentElement.firstChild);
    }

    function clearFilterPopover() {
      const contentElement = filterPopoverElement.querySelector('.filter-popover-content');
      while (contentElement.firstChild) contentElement.removeChild(contentElement.firstChild);
    }

    function getSortedSenders() {
      const sortedSenders = [...senders];
      sortedSenders.sort((a, b) => {
        if (!!a.isNPC !== !!b.isNPC) return a.isNPC ? 1 : -1;
        return a.name.localeCompare(b.name);
      });
      return sortedSenders;
    }

    function showSenderColours() {
      if (lastPopoverOpener === popoverOpeners.senderColours) {
        closeFilterPopover();

      }

      const sortedSenders = getSortedSenders();
      const descriptionElement = document.createElement('p');
      descriptionElement.innerText = '선택하면 발신자에게 맞춤 색상을 적용합니다.'
      fragment.appendChild(descriptionElement);
      const toggleContainer = document.createElement('div');
      toggleContainer.className = 'filter-types-toggle-container';
      const noneToggle = document.createElement('span');
      noneToggle.innerText = 'None';
      noneToggle.onclick = () => {
        customSenderColours.splice(0, customSenderColours.length);
        const checkboxes = contentElement.querySelectorAll('input[type=checkbox]');
        let hasChanges = false;
        for (const checkbox of checkboxes) {
          if (checkbox.checked) hasChanges = true;
          checkbox.checked = false;
        }
        for (const sender of sortedSenders) {
          senderPreferences[sender.name] = { ...senderPreferences[sender.name], colorEnabled: false };
        }
        if (hasChanges) generateOutput(currentParsedLines);
        updateColours();
      }
      toggleContainer.appendChild(noneToggle);
      fragment.appendChild(toggleContainer);
      for (const sender of sortedSenders) {
        const senderColourElement = document.createElement('div');
        senderColourElement.className = 'filter-message-type-grid hover-highlight';
        senderColourElement.innerHTML = `
          <label>
            <input type="checkbox" >
            <span>${formatSenderNameForMenu(sender)}</span>
          </label>
          <input type="color">
        `;
        const checkboxElement = senderColourElement.querySelector('input[type=checkbox]');
        checkboxElement.checked = !!customSenderColours.find(s => s === sender);
        checkboxElement.addEventListener('click', () => {
          if (!checkboxElement.checked) {
            const index = customSenderColours.indexOf(sender);
            if (index !== -1) customSenderColours.splice(index, 1);
          } else {
            customSenderColours.push(sender);
          }
          senderPreferences[sender.name] = { ...senderPreferences[sender.name], colorEnabled: checkboxElement.checked };
          updateColours();
        });
        checkboxElement.addEventListener('change', () => {
          requestAnimationFrame(() => generateOutput(currentParsedLines));
        });
        const colorElement = senderColourElement.querySelector('input[type=color]');
        colorElement.value = sender.customColor || '#ffffff';
        colorElement.addEventListener('input', () => {
          sender.customColor = colorElement.value;
          senderPreferences[sender.name] = { ...senderPreferences[sender.name], customColor: sender.customColor };
          if (!checkboxElement.checked) checkboxElement.click();
          updateColours();
        });
        fragment.appendChild(senderColourElement);
      }
      contentElement.appendChild(fragment);
      positionPopover();
    }

    function showNameRename() {
      if (lastPopoverOpener === popoverOpeners.nameRename) {

      const contentElement = showFilterPopoverAndGetContentElement(popoverOpeners.nameRename);
      const fragment = document.createDocumentFragment();

      const desc = document.createElement('p');
      desc.innerText = '새 이름을 입력하고 체크박스로 적용/해제할 수 있습니다.';
      fragment.appendChild(desc);

      const sortedSenders = getSortedSenders();

      for (const sender of sortedSenders) {
        // 빈 이름(시스템 로그 등)은 이름 변경 목록에서 제외
        if (!sender.name || sender.name.trim() === '') continue;

        const normalizedSenderName = getCharacterName(sender.name);
        const rule = nameReplacements[normalizedSenderName] || { newName: '', active: false };

        const row = document.createElement('div');
        row.className = 'filter-message-type-grid hover-highlight';
        row.style.cssText = 'display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; padding: 2px 4px;';

        // 원본 이름 라벨 — 현재 서버명 표시 설정을 따름
        const label = document.createElement('span');
        label.textContent = formatSenderNameForMenu(sender);
        label.style.cssText = 'font-size: 0.9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';

        // 새 이름 입력칸
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '새 이름';
        input.value = rule.newName;
        input.style.cssText = 'width: 100px; padding: 1px 4px; background: transparent; color: inherit; border: 1px solid var(--color-light-hsl); border-radius: 3px; font-size: 0.9em;';

        // 적용 체크박스
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = rule.active && !!rule.newName;
        checkbox.title = '체크하면 이름 변경 적용';

        const applyChange = () => {
          const newName = input.value.trim();
          const normalizedSenderName = getCharacterName(sender.name);
          if (newName && checkbox.checked) {
            nameReplacements[normalizedSenderName] = { newName, active: true };
          } else if (newName && !checkbox.checked) {
            nameReplacements[normalizedSenderName] = { newName, active: false };
          } else {
            delete nameReplacements[normalizedSenderName];
            checkbox.checked = false;
          }
          generateOutput(currentParsedLines);
        };

        // input 변경 시: 값만 저장, 체크박스 상태는 건드리지 않음
        input.addEventListener('change', () => {
          applyChange();
        });

        // 체크박스 클릭 시: 체크박스 상태만 반영
        checkbox.addEventListener('change', () => {
          applyChange();
        });

        row.appendChild(label);
        row.appendChild(input);
        row.appendChild(checkbox);
        fragment.appendChild(row);
      }

      contentElement.appendChild(fragment);
      positionPopover();
    }

    function applyUiTheme(themeName) {
      document.documentElement.classList.remove('theme-classic', 'theme-light');
      if (themeName === 'classic') document.documentElement.classList.add('theme-classic');
      else if (themeName === 'light') document.documentElement.classList.add('theme-light');
      localStorage.setItem('ffxiv-ui-theme', themeName);
      // 필터 타입 기본 컬러를 테마에 맞게 조정 (빛 테마는 더 진하게, 말하기·커스텀 색상은 제외)
      if (typeof applyMessageTypeColoursForTheme === 'function') applyMessageTypeColoursForTheme(themeName);
      // 이미 불러온 로그가 있으면 기본 텍스트색(000a 등)을 새 테마에 맞게 갱신
      if (typeof updateColours === 'function') updateColours();
    }

    function getCurrentUiTheme() {
      if (document.documentElement.classList.contains('theme-classic')) return 'classic';
      if (document.documentElement.classList.contains('theme-light')) return 'light';
      return 'dark';
    }

      });

      container.querySelector('#bg-color-reset-btn').addEventListener('click', () => {
        resetBgColor();
        container.querySelector('#bg-color-picker').value = '#0d0d0d';
      });

      const statusElement = container.querySelector('#settings-io-status');
      let statusTimeoutId = null;
      function showIoStatus(message, isError) {
        statusElement.textContent = message;
        statusElement.style.color = isError ? '#e04040' : 'var(--theme-panel-accent-text)';
        if (statusTimeoutId) clearTimeout(statusTimeoutId);
        statusTimeoutId = setTimeout(() => { statusElement.textContent = ''; }, 3000);
      }

      container.querySelector('#settings-reset-btn').addEventListener('click', () => {
        if (!confirm('저장된 모든 설정을 초기화할까요?')) return;
        resetAllSettings();
        showIoStatus('설정을 초기화했습니다', false);
        refreshActiveState();
        container.querySelector('#bg-color-picker').value = '#0d0d0d';
      });

      container.querySelector('#settings-export-btn').addEventListener('click', () => {
        exportUserSettingsToFile();
        showIoStatus('설정을 내보냈습니다', false);
      });

      const importInput = container.querySelector('#settings-import-input');
      container.querySelector('#settings-import-btn').addEventListener('click', () => {
        importInput.click();
      });
      importInput.addEventListener('change', () => {
        const file = importInput.files[0];
        importInput.value = '';
        if (!file) return;
        importUserSettingsFromFile(file, (success, message) => {
          showIoStatus(message, !success);
          if (success) refreshActiveState();
        });
      });

      const btnMap = {
        dark: container.querySelector('#theme-dark-btn'),
        classic: container.querySelector('#theme-classic-btn'),
        light: container.querySelector('#theme-light-btn'),
      };

      function refreshActiveState() {
        const current = getCurrentUiTheme();
        for (const name in btnMap) {
          btnMap[name].classList.toggle('active', name === current);
        }
      }
      refreshActiveState();

      for (const name in btnMap) {
        btnMap[name].onclick = () => {
          applyUiTheme(name);
          refreshActiveState();
        };
      }
    }
